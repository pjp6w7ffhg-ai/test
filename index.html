<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=402, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" content="#1C87D8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>One Way Ticket</title>
    <link rel="stylesheet" href="static/style.css">
    <script>
        // Load color.css with a cache-busting timestamp to ensure updates apply
        (function() {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = `static/color.css?t=${Date.now()}`;
            document.head.appendChild(link);
        })();
    </script>
    <style>
        /* Coordinates measured from a real iPhone 16 Pro screenshot (402x874 @3x). Fixed-width viewport (see meta tag) lets the browser auto-scale this to any screen, same technique as static-details.html. */
        html,body { margin:0; padding:0; background:#1C87D8; }
        body { font-family: "SF Pro Display Medium", -apple-system, Arial, sans-serif; }
        .main-bg {
            /* The 874px canvas is the FULL screen, so every `top` below is measured from the top of the
               screen and the first 59px are the iPhone 16 Pro status bar. iOS only puts the web view under
               the status bar when the web clip was added with a black-translucent status bar (then
               env(safe-area-inset-top) is 59px); with the default opaque bar the web view starts BELOW the
               bar and the inset is 0 (and since iOS 26.1 black-translucent no longer works at all). Shift the
               canvas up by whatever part of those 59px the status bar already covers, so the header lands at
               the same screen position either way instead of 59px too low. */
            --inset-top: env(safe-area-inset-top, 0px);
            position: relative;
            width: 402px; height: 874px; margin: calc(var(--inset-top) - 59px) auto 0; overflow: hidden;
            background: linear-gradient(to bottom, #1C87D8 0%, #1C87D8 48%, #fff 48%, #fff 100%);
        }
        .header-bar { position:absolute; top:0; left:0; width:402px; height:0; padding:0; }
        .header-title {
            position:absolute; top:91px; left:0; width:402px; padding-left:12.7px; box-sizing:border-box; text-align:center;
            font-size:17.88px; font-weight:600; line-height:1; color:#fff; letter-spacing:0;
        }
        .back-arrow {
            position:absolute; left:9px; top:88px; width:24px; height:24px;
            display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;
        }
        .back-arrow svg { width:24px; height:24px; }
        .ticket-container {
            position:absolute; top:122px; left:20px;
            width:362px; height:698px;
            background:#fff; border-radius:13px;
            box-shadow:0 10px 24px rgba(0,0,0,0.10);
            padding:0; margin:0; max-width:none; min-height:0;
            display:block;
        }
        .qr-border {
            position:absolute; top:20px; left:71px;
            width:194px; height:194px; border:13px solid var(--first);
            border-radius:8px; background:#fff; box-sizing:content-box;
            display:flex; align-items:center; justify-content:center;
        }
        .qr-border img { width:178px; height:178px; }
        .tap-enlarge { position:absolute; top:246px; left:0; width:362px; text-align:center;
            font-size:13.46px; font-weight:600; line-height:1; color:#000; cursor:pointer; }
        .ticket-container hr { position:absolute; top:266px; left:56px; width:245px;
            border:none; border-top:2px dashed #8E8E93; margin:0; }
        .ticket-title { position:absolute; top:302px; left:0; width:362px; text-align:center;
            font-size:32px; font-weight:700; line-height:1; color:#FF3B30; margin:0; }
        .zone-number { position:absolute; top:342.7px; left:0; width:362px; text-align:center;
            font-size:27.05px; font-weight:700; line-height:1; color:#000; margin:0; }
        .zone-ride { position:absolute; top:381px; left:0; width:362px; text-align:center;
            font-size:21px; font-weight:600; line-height:1; color:#000; margin:0; }
        .zone-dis { position:absolute; top:405.3px; left:0; width:362px; text-align:center;
            font-size:16.54px; font-weight:600; line-height:1; color:#6B6B76; margin:0; }
        .color-strip { position:absolute; top:603px; left:25px; width:312px; height:10px;
            display:flex; margin:0; border-radius:0; overflow:hidden; }
        .color-block { flex:1; }
        .progress-bar-bg { position:absolute; top:630px; left:60px; width:242px; height:8px;
            margin:0; background:#D3DAE1; border-radius:4px; overflow:visible; }
        .progress-bar { height:100%; background:#0094FF; border-radius:4px; transition:width 1s linear; }
        .progress-handle { position:absolute; top:50%; width:8px; height:8px; background:#0094FF;
            border-radius:50%; transform:translate(-50%,-50%); transition:left 1s linear; }
        .expires { position:absolute; top:649.3px; left:-2px; width:362px; text-align:center;
            font-size:20px; font-weight:400; line-height:1; color:#000; margin:0; }
        .expires span { font-weight:700; }
        .validator-link { position:absolute; top:671.7px; left:-1.7px; width:362px; text-align:center;
            display:block; font-size:11.78px; font-weight:400; line-height:1; color:#000;
            text-decoration:underline; margin:0; cursor:pointer; }
        .page-dot { position:absolute; top:832px; left:197px; width:8px; height:8px;
            background:#000; border-radius:50%; margin:0; }
    </style>
</head>
<body>
    <div class="main-bg">
        <div style="background:#1C87D8; width:100%; border-top-left-radius:32px; border-top-right-radius:32px;">
            <div class="header-bar" style="background:transparent;">
                <span class="back-arrow" onclick="window.location.href='static-details.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </span>
                <span class="header-title">One Way Ticket</span>
            </div>
        </div>
        <div class="ticket-container">
            <div class="qr-border">
                <img src="static/your-qr-code-image.png" alt="QR Code">
            </div>
            <div class="tap-enlarge" onclick="window.location.href='static-details.html'">Tap to enlarge</div>
            <hr>
            <div class="ticket-title">INTERSTATE</div>
            <div class="zone-number">11</div>
            <div class="zone-ride">ZONE RIDE</div>
            <div class="zone-dis">1 Adult</div>
            <div class="color-strip">
                <div class="color-block" style="background: var(--stripone);"></div>
                <div class="color-block" style="background: var(--striptwo);"></div>
                <div class="color-block" style="background: var(--stripthree);"></div>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
                <div id="progress-handle" class="progress-handle" style="left: 0%"></div>
            </div>
            <div class="expires">Expires in <span id="countdown">60:00</span></div>
            <a class="validator-link" href="#">View Onboard Validator Instructions</a>
        </div>
        <div class="page-dot"></div>
    </div>
    <script>
        // --- 60-minute deadline with persistence + 10-min auto reset ---
        let deadlineDate = null;
        function setDeadline() {
            const now = new Date();
            const deadline = new Date(now.getTime() + 60 * 60 * 1000); // 60 minutes from now
            localStorage.setItem('deadlineDate', String(deadline.getTime()));
            localStorage.setItem('deadlineStart', String(now.getTime()));
            window.deadlineDate = deadline;
        }

        function initDeadline() {
            let navType = 'navigate';
            const entries = performance.getEntriesByType && performance.getEntriesByType('navigation');
            if (entries && entries.length > 0) {
                navType = entries[0].type; // 'navigate' | 'reload' | 'back_forward'
            }
            const stored = localStorage.getItem('deadlineDate');
            if (navType === 'reload') {
                // Reset only on hard refresh of index
                setDeadline();
            } else if (stored) {
                window.deadlineDate = new Date(parseInt(stored, 10));
            } else {
                // First visit: initialize deadline
                setDeadline();
            }
        }

        function updateCountdown() {
            const countdown = document.getElementById('countdown');
            const progressBar = document.getElementById('progress-bar');
            if (!countdown) return;
            if (!window.deadlineDate) {
                const stored = localStorage.getItem('deadlineDate');
                if (stored) {
                    window.deadlineDate = new Date(parseInt(stored, 10));
                } else {
                    setDeadline();
                }
            }
            const now = new Date();
            // Auto-reset after 10 minutes elapsed since last start
            const startStored = localStorage.getItem('deadlineStart');
            if (startStored) {
                const startedAt = parseInt(startStored, 10);
                if (!isNaN(startedAt) && (now.getTime() - startedAt) >= (10 * 60 * 1000)) {
                    setDeadline();
                }
            }
            let diff = Math.max(0, window.deadlineDate - now);
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            countdown.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (diff <= 0) {
                countdown.textContent = '00:00';
            }
            // Progress bar logic (fill as time goes on)
            if (progressBar) {
                const total = 60 * 60 * 1000; // 60 minutes in ms
                const elapsed = total - diff;
                const percent = Math.min(1, Math.max(0, elapsed / total));
                progressBar.style.width = `${percent * 100}%`;
                const handle = document.getElementById('progress-handle');
                if (handle) handle.style.left = `${percent * 100}%`;
            }
        }
        initDeadline();
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
